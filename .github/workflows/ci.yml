name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'site/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'site/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # вопросы с выводом кода сверены на этой версии Node — тексты ошибок V8 между версиями отличаются
          node-version: 25
          cache: npm
      - run: npm ci
      - name: Type-check and verify content
        run: npm run verify:content
